services:
  - type: web
    name: kumpadres-coc-bot
    runtime: node
    plan: free
    rootDir: discord-bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: COC_CHANNEL_ID
        sync: false
