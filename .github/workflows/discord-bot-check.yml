name: Discord bot syntax check

on:
  push:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-check.yml"
  pull_request:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        working-directory: discord-bot
        run: npm run check
